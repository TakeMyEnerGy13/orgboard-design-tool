  <g fill="#22282c">
    <text x="41" y="33" font-family="system-ui, sans-serif" font-size="12" font-weight="700">9:41</text>
    <path d="M213 30h2.5v3H213zM216.5 28h2.5v5h-2.5zM220 26h2.5v7H220zM223.5 24h2.5v9h-2.5z"/>
    <path d="M230 27q5.4-5 10.8 0m-9 2q3.7-3.4 7.2 0m-5.4 2q1.8-1.7 3.6 0" fill="none" stroke="#22282c" stroke-width="1.35" stroke-linecap="round"/>
    <rect x="245" y="25" width="13" height="7" rx="2" fill="none" stroke="#555a5c"/>
    <rect x="246.6" y="26.5" width="9.7" height="4" rx="1"/>
    <path d="M259.2 27v3" stroke="#555a5c" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="108" y="588" width="84" height="3.7" rx="1.85"/>
